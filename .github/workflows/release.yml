name: Build and publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test update validation and recovery
        shell: pwsh
        run: ./test.ps1
      - name: Build verified Firefox bundle and installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { ./build.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1)) }
          else { ./build.ps1 }
      - name: Save build verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*
          retention-days: 7
      - name: Publish complete release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -eq 'false') { Write-Output 'Release is already public; existing files stay immutable.'; exit 0 }
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "红旗渠爱国浏览器 $tag" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          }
          $assets = (Get-ChildItem -LiteralPath dist -File).FullName
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; draft remains unpublished' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
